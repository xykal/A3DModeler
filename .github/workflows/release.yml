name: Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0-alpha02

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.A3D_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/a3d-release.p12"
      - name: Test editor core
        run: |
          cmake -S editor-core -B "$RUNNER_TEMP/editor-core-build"
          cmake --build "$RUNNER_TEMP/editor-core-build" --parallel
          ctest --test-dir "$RUNNER_TEMP/editor-core-build" --output-on-failure
      - name: Build signed split APKs and AAB
        env:
          A3D_KEYSTORE_FILE: ${{ runner.temp }}/a3d-release.p12
          A3D_KEYSTORE_PASSWORD: ${{ secrets.A3D_KEYSTORE_PASSWORD }}
          A3D_KEY_ALIAS: ${{ secrets.A3D_KEY_ALIAS }}
          A3D_KEY_PASSWORD: ${{ secrets.A3D_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Verify signatures and stage files
        run: |
          mkdir -p release-assets
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            case "$apk" in
              *armeabi-v7a*) name="A3DModeler-${{ inputs.tag }}-armeabi-v7a.apk" ;;
              *arm64-v8a*) name="A3DModeler-${{ inputs.tag }}-arm64-v8a.apk" ;;
              *) echo "Unexpected APK output: $apk"; exit 1 ;;
            esac
            cp "$apk" "release-assets/$name"
          done
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/A3DModeler-${{ inputs.tag }}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "release-assets/A3DModeler-${{ inputs.tag }}-r8-mapping.txt"
          ls -lh release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ inputs.tag }}
          path: release-assets/*
          if-no-files-found: error
      - name: Create draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: A3D Modeler ${{ inputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
